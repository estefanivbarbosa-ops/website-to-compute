<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>OUTFIT DAY COLLECTION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.2/p5.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #EFE1C6; /* Pantone Buttercream */
        font-family: Georgia, serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="let estado = "inicio";
let coleccionActual = -1;
let colecciones = [];
let scrollY = 0;
let velocidadScroll = 20;
let videos = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont("Georgia");
  textAlign(CENTER, CENTER);

  // nombres de ejemplo (pondrás los tuyos)
  colecciones = [
    "ELEGANT 1/2",
    "PLASTIC SOUL",
    "DON’T SCROLL",
    "HYPERBURN",
    "SOFT DAMAGE",
    "TOXIC MINT",
    "LOVELY ERROR",
    "FAKE BODY",
    "EXCESS",
    "NATURAL ADDICT",
    "INVISIBLE",
    "DOLL SKIN",
    "COLD PINK",
    "HUMAN RESET",
    "DIGITAL FLESH",
    "PURE ERROR",
    "GLASS MIND",
    "ICONIC WASTE",
    "HEAVY SCENT",
    "CANDY VOID",
    "ABSURD BEAUTY",
    "WET FACE",
    "LUXURY TRASH",
    "DISORDER"
  ];
}

function draw() {
  background("#EFE1C6");

  if (estado === "inicio") {
    mostrarLista();
  } else if (estado === "coleccion") {
    mostrarColeccion();
  }
}

function mostrarLista() {
  fill(0);
  textSize(24);
  textAlign(LEFT, TOP);
  text("OUTFIT DAY COLLECTION", 40, 30);

  textSize(22);
  textAlign(CENTER, CENTER);

  let startY = 100 + scrollY;

  for (let i = 0; i < colecciones.length; i++) {
    let y = startY + i * 60;
    if (y > -50 && y < height + 50) {
      text(colecciones[i], width / 2, y);
      if (mouseIsPressed && dist(mouseX, mouseY, width / 2, y) < 100) {
        coleccionActual = i;
        estado = "coleccion";
      }
    }
  }
}

function mostrarColeccion() {
  fill(0);
  textSize(32);
  textAlign(CENTER, CENTER);
  text(colecciones[coleccionActual], width / 2, 60);

  // Aquí puedes mostrar tu video
  textSize(18);
  text("(Aquí se mostrará el video de la colección)", width / 2, height / 2);

  // Botón volver
  textSize(16);
  textAlign(LEFT, BOTTOM);
  text("← Volver", 40, height - 40);

  if (mouseIsPressed && mouseX < 150 && mouseY > height - 100) {
    estado = "inicio";
  }
}

function mouseWheel(event) {
  scrollY -= event.delta / 2;
  scrollY = constrain(scrollY, -colecciones.length * 60 + height - 100, 0);
}"></script>
  </body>
</html>
